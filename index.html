<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>lexiGÓ</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b0f1a;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #game {
      width: 100%;
      height: 100%;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <!-- Phaser 3 mit fester Version -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>

  <!-- ?v=… bei jeder Änderung hochzählen (gleich wie GAME_VERSION in src/main.js), damit Safari keine alten Dateien aus dem Cache nimmt -->
  <!-- Eigene Skripte: Daten, Eingabe, Logik, Objekte, Szenen, dann der Start -->
  <script src="src/state/player.js?v=0.2.0"></script>
  <script src="src/input/KeyboardInput.js?v=0.2.0"></script>
  <script src="src/logic/movement.js?v=0.2.0"></script>
  <script src="src/logic/collision.js?v=0.2.0"></script>
  <script src="src/objects/PlayerFigure.js?v=0.2.0"></script>
  <script src="src/world/GameMap.js?v=0.2.0"></script>
  <script src="src/world/MapLoader.js?v=0.2.0"></script>
  <script src="src/scenes/WorldScene.js?v=0.2.0"></script>
  <script src="src/main.js?v=0.2.0"></script>
</body>
</html>
